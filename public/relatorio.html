<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório — Natal Solidário 2026 · Oratório</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{ --navy:#0F2547; --navy-dark:#0A1A33; --gold:#C9A24B; --cream:#FBF4E4; --ink:#2A2A2A; }
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:Calibri,'Trebuchet MS',Arial,sans-serif; }
  .topo{ background:var(--cream); text-align:center; padding:12px 16px 8px; border-bottom:3px solid var(--gold); }
  .topo img{ height:64px; max-width:100%; }
  header{ background:var(--navy); color:#fff; padding:16px; text-align:center; border-bottom:4px solid var(--gold); }
  header h2{ margin:0; font-family:Georgia,serif; }
  header small{ color:#F0CC6E; letter-spacing:.12em; text-transform:uppercase; }
  main{ max-width:960px; margin:30px auto; padding:0 20px; }
  .actions{ display:flex; gap:10px; justify-content:flex-end; margin-bottom:20px; }
  button{ padding:10px 16px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; color:#fff; font-family:inherit; }
  .btn-pdf{ background:#D32F2F; }
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 6px rgba(0,0,0,.05); }
  th,td{ padding:11px 14px; text-align:left; border-bottom:1px solid #E4D9BC; font-size:14px; }
  th{ background:#EFE4C6; color:var(--navy); }
  .female{ color:#A63D6B; font-weight:bold; }
  .male{ color:#1F4E8C; font-weight:bold; }
  .resumo{ display:flex; gap:20px; margin-bottom:20px; }
  .card{ background:#fff; padding:15px 20px; border-radius:8px; border-left:4px solid var(--navy); box-shadow:0 2px 4px rgba(0,0,0,.05); }
  .card .t{ font-size:12px; color:#6B6B6B; }
  .card .v{ font-size:24px; font-weight:bold; color:var(--navy); }
  .site-footer{ margin-top:40px; background:var(--cream); text-align:center; padding:22px 18px; border-top:1px solid var(--gold); color:#9A7B2E; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="topo"><img src="img/oratorio-logo.png" alt="Oratório"></div>
<header>
  <small>Natal Solidário 2026</small>
  <h2>Relatório de Apadrinhamento — Pequenos Pés, Grandes Sorrisos</h2>
</header>

<main>
  <div class="resumo">
    <div class="card"><div class="t">Total apadrinhadas</div><div class="v" id="totalCount">0/0</div></div>
  </div>

  <div class="actions"><button class="btn-pdf" onclick="exportarPDF()">Exportar PDF</button></div>

  <table id="tabelaDados">
    <thead>
      <tr>
        <th>Nº</th>
        <th>Criança</th>
        <th>Gênero</th>
        <th>Chinelo</th>
        <th>Padrinho / Madrinha</th>
        <th>Telefone</th>
        <th>Data/Hora</th>
      </tr>
    </thead>
    <tbody id="corpoTabela">
      <tr><td colspan="7" style="text-align:center;">Carregando dados...</td></tr>
    </tbody>
  </table>
</main>

<div class="site-footer">Oratório • Natal 2026</div>

<script>
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function carregarDados(){
    const tbody = document.getElementById('corpoTabela');
    try {
      const [rc, ra] = await Promise.all([fetch('/criancas.json'), fetch('/api/apadrinhamentos')]);
      const criancas = await rc.json();
      const data = await ra.json();
      const porId = {}; criancas.forEach(c => porId[c.id] = c);

      data.sort((a, b) => a.crianca_id - b.crianca_id);
      document.getElementById('totalCount').textContent = `${data.length}/${criancas.length}`;

      if(data.length === 0){
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nenhuma criança apadrinhada ainda.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      data.forEach(row => {
        const c = porId[row.crianca_id] || {nome:'—', sapato:'—', genero:''};
        const genero = c.genero === 'F' ? '<span class="female">Feminino</span>' : '<span class="male">Masculino</span>';
        const d = new Date(row.criado_em);
        const dataFmt = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${String(row.crianca_id).padStart(3,'0')}</b></td>
          <td>${esc(c.nome)}</td>
          <td>${genero}</td>
          <td>nº ${esc(c.sapato)}</td>
          <td>${esc(row.nome)}</td>
          <td>${esc(row.telefone)}</td>
          <td>${dataFmt}</td>`;
        tbody.appendChild(tr);
      });
    } catch(e) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:red;">Erro ao buscar dados.</td></tr>';
    }
  }

  function exportarPDF(){
    const acoes = document.querySelector('.actions');
    acoes.style.display = 'none';
    const conteudo = document.createElement('div');
    conteudo.style.background = '#FBF4E4';
    conteudo.appendChild(document.querySelector('.topo').cloneNode(true));
    conteudo.appendChild(document.querySelector('header').cloneNode(true));
    const miolo = document.createElement('div');
    miolo.style.padding = '24px 30px';
    miolo.appendChild(document.querySelector('.resumo').cloneNode(true));
    miolo.appendChild(document.getElementById('tabelaDados').cloneNode(true));
    conteudo.appendChild(miolo);
    conteudo.appendChild(document.querySelector('.site-footer').cloneNode(true));

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#FBF4E4;overflow:auto;padding:20px 0;';
    overlay.appendChild(conteudo);
    document.body.appendChild(overlay);

    setTimeout(() => {
      html2pdf().set({
        margin: 0.4, filename: 'Relatorio_Natal_Solidario_Oratorio.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#FBF4E4' },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' },
        pagebreak: { mode: ['css', 'legacy'] }
      }).from(conteudo).save().finally(() => {
        document.body.removeChild(overlay);
        acoes.style.display = 'flex';
      });
    }, 150);
  }

  carregarDados();
</script>
</body>
</html>
